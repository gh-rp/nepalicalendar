<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3d2e24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="#f6f1e8"/>

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="384" height="384" rx="48" fill="url(#bg)" stroke="#e5dacb" stroke-width="6"/>
    <!-- Calendar Top Bar -->
    <path d="M 64 112 C 64 85.49 85.49 64 112 64 L 400 64 C 426.51 64 448 85.49 448 112 L 448 168 L 64 168 Z" fill="url(#headerGrad)"/>
    
    <!-- Rings -->
    <circle cx="160" cy="64" r="14" fill="#f6f1e8" stroke="#991b1b" stroke-width="4"/>
    <circle cx="352" cy="64" r="14" fill="#f6f1e8" stroke="#991b1b" stroke-width="4"/>
  </g>

  <!-- Header Text: पात्रो -->
  <text x="256" y="132" font-family="serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">पात्रो</text>

  <!-- Central Devanagari Date Symbol '१' -->
  <text x="256" y="328" font-family="serif" font-size="160" font-weight="900" fill="#322319" text-anchor="middle">१</text>

  <!-- Subtitle: NEPALI PATRO -->
  <text x="256" y="396" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#b91c1c" text-anchor="middle">NEPALI PATRO</text>
</svg>
